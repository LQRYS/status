# Upptime configuration for Syrql/BiznessmMatch platform
# https://upptime.js.org/docs/configuration

owner: LQRYS
repo: status

sites:
  # Production
  - name: Production Frontend
    url: https://misterbridge.com
    icon: https://misterbridge.com/favicon.ico

  - name: Production API
    url: https://api.misterbridge.com/healthz
    icon: https://misterbridge.com/favicon.ico

  - name: Production Upload
    url: https://upload.misterbridge.com/hello
    icon: https://misterbridge.com/favicon.ico

  # Staging
  - name: Staging Frontend
    url: https://staging.matchbiz.fr
    icon: https://staging.matchbiz.fr/favicon.ico

  - name: Staging API
    url: https://api.staging.matchbiz.fr/healthz
    icon: https://staging.matchbiz.fr/favicon.ico

  - name: Staging Upload
    url: https://upload.staging.matchbiz.fr/hello
    icon: https://staging.matchbiz.fr/favicon.ico
status-website:
  baseUrl: /status
  logoUrl: https://staging.matchbiz.fr/favicon.ico
  name: MisterBridge Platform Status
  introTitle: "**MisterBridge** is the professional networking platform for business events."
  introMessage: This page provides real-time status information for all MisterBridge services. Subscribe to updates to get notified when there are incidents or scheduled maintenance.
  navbar:
    - title: Status
      href: /
    - title: MisterBridge
      href: https://misterbridge.com

# Notifications (email via GitHub Actions secrets)
notifications:
  - type: email
    address: team@misterbridge.com

# Incident management
assignees:
  - dev

# Check every 5 minutes
workflowSchedule:
  uptime: "*/5 * * * *"
  responseTime: "*/5 * * * *"
  updates: "0 0 * * *"
  graphs: "0 0 * * *"
  staticSite: "0 0 * * *"
  summary: "0 0 * * *"

# Commits configuration
commitMessages:
  commitAuthorName: "Upptime Bot"
  commitAuthorEmail: "upptime@misterbridge.com"
  templateRecoveredRecoveredRecovered: "🟢 $SITE is back up"
  templateCommitTemplateRecoveredRecoveredRecoveredRecovered: "🟢 $SITE is back up"
  templateDegraded: "🟡 $SITE has degraded performance"
  templateDown: "🔴 $SITE is down"

# User agent for requests
user-agent: "Upptime/MisterBridge-Status-Monitor"

# Response time thresholds (ms)
responseTime:
  degradedThreshold: 2000
  downThreshold: 10000

# Skip duplicate issues
skipDuplicateIssues: true
