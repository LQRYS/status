name: Summary CI
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  summary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Upptime
        uses: upptime/uptime-monitor@v1.38.0
        with:
          token: ${{ secrets.GH_PAT }}
          command: summary
