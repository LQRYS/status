name: Update Template CI
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
jobs:
  update-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          persist-credentials: true
          fetch-depth: 0
      - name: Run Upptime
        uses: upptime/uptime-monitor@v1.43.1
        with:
          command: update-template
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
